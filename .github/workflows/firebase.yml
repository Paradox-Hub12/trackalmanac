# Predictor: publishes firebase/firestore.rules to Cloud Firestore, keeps rounds/ (lock times) in step,
# and fills in the public web config in src/game.json if it is still empty.
# Runs when the rules change on main, or with "Run workflow". Uses the FIREBASE_SERVICE_ACCOUNT secret.
name: Firebase

on:
  push:
    branches: [main]
    paths: ["firebase/firestore.rules", "scripts/firebase_tasks.py", ".github/workflows/firebase.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet --disable-pip-version-check firebase-admin
      - name: Publish the Firestore security rules
        run: python3 scripts/firebase_tasks.py deploy-rules
      - name: Sync rounds (lock times) and scores
        run: python3 scripts/score.py
      - name: Web config for the game pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/firebase_tasks.py web-config
          if [ -n "$(git status --porcelain src/game.json)" ]; then
            python3 build.py > /dev/null
            node --check app.js && node --check data.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && git commit -q -m "Predictor: Firebase web config"
            git pull -q --rebase origin main && git push -q origin HEAD:main
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null || true
            echo "Web config committed; the game is on."
          fi
