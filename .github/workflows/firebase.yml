# Predictor: publishes firebase/firestore.rules to Cloud Firestore, keeps rounds/ (lock times) in step,
# fills in the public web config in src/game.json if it is still empty, and copies Firebase's sign-in
# helper pages to /__/auth/ (Google sign-in on our own domain).
# Runs when the rules change on main, or with "Run workflow". Uses the FIREBASE_SERVICE_ACCOUNT secret.
name: Firebase

on:
  push:
    branches: [main]
    paths: ["firebase/firestore.rules", "scripts/firebase_tasks.py", ".github/workflows/firebase.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet --disable-pip-version-check firebase-admin
      - name: Publish the Firestore security rules
        run: python3 scripts/firebase_tasks.py deploy-rules
      - name: Sync rounds (lock times) and scores
        run: python3 scripts/score.py
      - name: Sign-in helper pages (/__/auth/ on this site)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/firebase_tasks.py auth-helper
          if [ -n "$(git status --porcelain __)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add __ && git commit -q -m "Predictor: Firebase sign-in helper pages"
            git pull -q --rebase --autostash origin main && git push -q origin HEAD:main
            echo "Sign-in helper pages committed."
          fi
      - name: Check the live sign-in helper page
        run: |
          r=$(curl -s -o /tmp/h.html -w '%{http_code} %{content_type}' https://trackalmanac.com/__/auth/handler)
          if echo "$r" | grep -q '^200 text/html' && grep -q 'handler.js' /tmp/h.html; then echo "::notice::/__/auth/handler is served: $r"
          else echo "::warning::/__/auth/handler is not served as a web page yet ($r). It goes live with the next Pages deploy; run this workflow again to check."; fi
      - name: Web config for the game pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/firebase_tasks.py web-config
          if [ -n "$(git status --porcelain src/game.json)" ]; then
            python3 build.py > /dev/null
            node --check app.js && node --check data.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && git commit -q -m "Predictor: Firebase web config"
            git pull -q --rebase origin main && git push -q origin HEAD:main
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null || true
            echo "Web config committed; the game is on."
          fi
