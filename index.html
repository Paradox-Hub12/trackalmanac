<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Track Almanac · Formula 1 results, standings &amp; history</title>
<meta name="description" content="Track Almanac: the 2026 Formula 1 season at a glance. Race calendar, live countdown, drivers' and constructors' standings, full race results and past-season archive.">
<meta property="og:title" content="Track Almanac · Formula 1 results, standings &amp; history">
<meta property="og:description" content="2026 F1 calendar, standings, race-by-race results and past seasons, updated after every Grand Prix.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='23' font-family='Arial Narrow,Arial' font-weight='900' font-size='18' text-anchor='middle' fill='%23ff8a1f'%3ETA%3C/text%3E%3C/svg%3E">
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: black engineering sheet. Main column (timeline, next race, race plates) with the timing tower on the RIGHT, scrolling on its own. Detail pages and the championship page reuse the same sheet language. Single deliberate dark look. */
:root{
  --sheet:#000000; --sheet-2:#07090d; --panel:#0b0e14; --panel-2:#111620; --rule:#1e2836; --rule-2:#2b3a4f; --grid:rgba(120,170,255,.055);
  --ink:#e9eff7; --ink-2:#a3b4c9; --ink-3:#66798f;
  --signal:#ff8a1f; --signal-ink:#000000; --done:#5f9dff;
  --s1:#ff4d5e; --s2:#2ec4e6; --s3:#ffd23f; --purple:#c06bff;
  --gold:#e8c45a; --silver:#c7ccd3; --bronze:#d08f55; --pts:#2f8a55; --fin:#2e4f80; --ret:#5d3d84; --dns:#1b222d;
  --tH:#f2f2f2; --tM:#ffd23f; --tS:#ff4d5e;
  --up-bg:#0b1220; --up-rule:#2a4166;
  --plate-ink:#cfe3ff; --plate-meta:#ffb35c;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--sheet);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--signal);outline-offset:2px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-data);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;margin:0;line-height:.9;text-wrap:balance}
.page{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

/* title block */
.tb{display:grid;grid-template-columns:auto minmax(0,1fr) auto;border:1.5px solid var(--rule-2);margin-top:16px;background:var(--panel)}
.tb>div{padding:10px 14px;border-right:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;min-width:0}
.tb>div:last-child{border-right:0}
.tb .logo{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:30px;line-height:.9;text-transform:uppercase}
.tb .logo span{color:var(--signal)}
.tb .tagline{display:block;margin-top:4px;font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tb nav{display:flex;gap:2px;flex-wrap:wrap}
.tb nav button{background:none;border:1px solid transparent;padding:6px 12px;cursor:pointer;font-family:var(--f-data);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.tb nav button:hover{color:var(--ink)}
.tb nav button[aria-current="page"]{border-color:var(--signal);color:var(--signal)}
@media (max-width:760px){.tb{grid-template-columns:minmax(0,1fr)}.tb>div{border-right:0;border-bottom:1px solid var(--rule)}.tb .meta{display:none}}

/* season ribbon: races placed on a real date scale */
.ribbon{margin-top:18px}
.rib-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.rib-head b{font-family:var(--f-display);font-weight:900;font-size:22px;text-transform:uppercase}
.rib-head b span{color:var(--signal)}
.rib-scroll{overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
.rib{position:relative;min-width:1040px;height:96px;margin:0 14px}
.rib .rail{position:absolute;left:0;right:0;top:44px;height:2px;background:var(--rule-2)}
.rib .fill{position:absolute;left:0;top:44px;height:2px;background:var(--done)}
.rib .mon{position:absolute;top:0;font-family:var(--f-data);font-size:10px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;border-left:1px solid var(--rule);padding-left:5px;height:52px}
.rib .today{position:absolute;top:26px;height:38px;border-left:1px dashed var(--signal)}
.rib .today i{position:absolute;top:-14px;left:-14px;font-style:normal;font-family:var(--f-data);font-size:9px;letter-spacing:.12em;color:var(--signal)}
.rib button{position:absolute;top:33px;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.rib .chip{width:24px;height:24px;display:grid;place-items:center;font-family:var(--f-data);font-size:10.5px;font-weight:600;border:1.5px solid var(--ink-3);background:var(--sheet);color:var(--ink-2)}
.rib button.done .chip{background:var(--done);border-color:var(--done);color:#03101f}
.rib button.next .chip{background:var(--signal);border-color:var(--signal);color:#000;width:30px;height:30px;margin-top:-3px;font-size:12px;box-shadow:0 0 0 4px rgba(255,138,31,.22)}
.rib .cc{font-family:var(--f-data);font-size:10px;letter-spacing:.06em;color:var(--ink-3)}
.rib button.next .cc{color:var(--signal);font-weight:600}
.rib .sp{position:absolute;top:-8px;width:6px;height:6px;border-radius:50%;background:var(--signal)}
.rib button:hover .chip,.rib button:focus-visible .chip{border-color:var(--ink)}
.rib button:hover .cc{color:var(--ink)}
.rib-key{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-data);font-size:10.5px;color:var(--ink-3);margin-top:2px}
.rib-key span{display:inline-flex;gap:6px;align-items:center}
.rib-key i{display:inline-block;width:10px;height:10px}

/* home layout: tower on the right */
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"sheet tower" "plates tower";gap:20px;margin-top:20px;align-items:start}
.home .sheet{grid-area:sheet}.home .plates-wrap{grid-area:plates;min-width:0}.home .tower{grid-area:tower}
@media (max-width:920px){.home{grid-template-columns:minmax(0,1fr);grid-template-areas:"sheet" "tower" "plates"}}
.tower{border:1.5px solid var(--rule-2);background:var(--panel);position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;min-height:0}
@media (max-width:920px){.tower{position:static;max-height:72vh}}
.tower header{display:flex;flex-direction:column;gap:8px;padding:12px;border-bottom:1.5px solid var(--rule-2);flex:none}
.tower header h2{font-size:26px;font-weight:900}
.tg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule-2)}
.tg button{background:none;border:0;padding:6px;cursor:pointer;font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.tg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.tscroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1 1 auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
.tower ol{list-style:none;margin:0;padding:0}
.tower li{display:grid;grid-template-columns:24px 3px 42px minmax(0,1fr) 46px;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--rule);font-size:13px}
.tower .p{font-family:var(--f-data);color:var(--ink-3);text-align:right}
.tower li:first-child .p{color:var(--gold)}
.tower .c{height:16px}
.tower .code{font-family:var(--f-display);font-weight:800;font-size:18px}
.tower .tm{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tower .pt{font-family:var(--f-data);text-align:right;font-weight:600}
.tower .pt small{display:block;font-weight:400;font-size:10px;color:var(--ink-3)}
.tower li.cons{grid-template-columns:24px 3px minmax(0,1fr) 46px}
.tower li.cons .code{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tower .gapline{padding:10px 12px;border-top:1.5px solid var(--rule-2);font-size:12px;color:var(--ink-2);flex:none}
.tower .gapline button{background:none;border:0;padding:0;color:var(--signal);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* next race sheet */
.sheet{border:1.5px solid var(--rule-2);background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
@media (max-width:760px){.sheet{grid-template-columns:minmax(0,1fr)}}
.sheet .l{padding:20px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--rule);min-width:0}
@media (max-width:760px){.sheet .l{border-right:0;border-bottom:1px solid var(--rule)}}
.sheet h1{font-size:clamp(56px,8vw,96px);font-weight:900}
.tag{display:inline-block;font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--rule-2);color:var(--ink-2);margin:0 6px 4px 0}
.tag.sig{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.cd{display:flex;gap:4px;align-items:baseline;font-family:var(--f-data);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.cd b{font-size:40px;font-weight:600;line-height:1}
.cd i{font-style:normal;font-size:12px;color:var(--ink-3);margin-right:10px}
.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule)}
.spec div{padding:8px 0}
.spec div+div{padding-left:10px;border-left:1px solid var(--rule)}
.spec b{display:block;font-family:var(--f-data);font-size:18px;font-weight:500}
.sheet .r{position:relative;padding:18px;min-width:0}
.sheet .r svg{width:100%;height:auto;display:block}
.corner{position:absolute;font-family:var(--f-data);font-size:10px;color:var(--ink-3);letter-spacing:.1em}

/* plates */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:28px 0 12px;padding-bottom:6px;border-bottom:1.5px solid var(--rule-2)}
.sec h2{font-size:34px;font-weight:900}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.plate{background:var(--panel);border:1px solid var(--rule-2);display:flex;flex-direction:column;transition:border-color .15s,transform .15s;cursor:pointer;position:relative}
.plate:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.plate:focus-visible{outline:2px dashed var(--signal);outline-offset:2px}
.plate.up{background:var(--up-bg);border-style:dashed;border-color:var(--up-rule)}
.plate.up .fig{border-bottom-style:dashed;border-bottom-color:var(--up-rule)}
.plate.up .fig svg{opacity:.75}
.plate.up .cap h3{color:var(--ink-2)}
.plate.nx{border:1.5px solid var(--signal);background:var(--up-bg)}
.plate .flag{position:absolute;top:8px;left:8px;font-family:var(--f-data);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;background:var(--signal);color:#000}
.plate .when{grid-column:1/-1;display:flex;flex-direction:column;gap:1px;margin-top:4px}
.plate .when b{font-family:var(--f-data);font-size:13px;font-weight:500;color:var(--plate-ink)}
.plate .acts.one{grid-template-columns:1fr}
.secbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sort{display:inline-flex;border:1px solid var(--rule-2)}
.sort button{background:none;border:0;padding:5px 10px;cursor:pointer;font-family:var(--f-data);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sort button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.plate .fig{padding:12px;border-bottom:1px solid var(--rule);aspect-ratio:16/10;max-width:100%}
.plate .fig svg{width:100%;height:100%}
.plate .cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:10px 12px}
.plate .cap h3{font-size:22px;font-weight:800;color:var(--plate-ink)}
.plate .cap .rn{font-family:var(--f-data);font-size:12px;font-weight:600;color:var(--plate-meta);text-align:right;line-height:1.35;letter-spacing:.04em}
.plate .pod{grid-column:1/-1;list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.plate .pod li{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--plate-ink);min-width:0}
.plate .pod li b{font-family:var(--f-data);font-size:11px;width:20px;color:var(--plate-meta)}
.plate .pod li:first-child b{color:var(--gold)}
.plate .pod li i{width:4px;height:14px;flex:none}
.plate .pod li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .cap .w{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.plate .cap .w i{width:10px;height:10px;flex:none}
.plate .acts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);margin-top:auto}
.plate .acts button{background:none;border:0;padding:9px 6px;cursor:pointer;font-family:var(--f-data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.plate .acts button+button{border-left:1px solid var(--rule);color:var(--signal)}
.plate .acts button:hover{background:var(--panel-2);color:var(--ink)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--sheet);border-left:1.5px solid var(--rule-2);z-index:41;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.navbtn{background:var(--panel);border:1px solid var(--rule-2);padding:7px 10px;cursor:pointer;font-family:var(--f-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.navbtn:hover:not(:disabled){border-color:var(--ink-3);color:var(--ink)}
.navbtn:disabled{opacity:.3;cursor:default}
.navbtn.sig{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:600}
.drawer h1{font-size:60px;font-weight:900;margin-top:14px}
.drawer .fig{border:1px solid var(--rule-2);background:var(--panel);padding:14px;margin-top:14px}
.res{border:1.5px solid var(--rule-2);margin-top:14px;background:var(--panel)}
.res .hd{padding:7px 12px;border-bottom:1px solid var(--rule)}
.res .row{display:grid;grid-template-columns:44px 4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--rule)}
.res .row:last-child{border-bottom:0}
.res .pos{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1}
.res .row.p1 .pos{color:var(--gold)}.res .row.p2 .pos{color:var(--silver)}.res .row.p3 .pos{color:var(--bronze)}
.res .c{height:26px}
.res strong{font-weight:600}
.res small{display:block;color:var(--ink-3);font-size:12px}
.res .t{font-family:var(--f-data);font-size:13px}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1.5px solid var(--rule-2);margin-top:14px;background:var(--panel)}
.dl div{padding:10px 12px;border-bottom:1px solid var(--rule);min-width:0}
.dl div:nth-child(odd){border-right:1px solid var(--rule)}
.dl b{display:block;font-family:var(--f-data);font-weight:500;font-size:17px}
.dl b.fl{color:var(--purple)}
.dl b.na{color:var(--ink-3);font-size:13px;font-weight:400}
.dl span.s{font-size:12px;color:var(--ink-2)}
.dnote{font-size:13px;color:var(--ink-2);margin-top:12px}
.dnav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:20px;align-items:center}
.dnav .navbtn:first-child{justify-self:start}.dnav .navbtn:last-child{justify-self:end}

/* detail page */
.dhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:16px}
@media (max-width:860px){.dhero{grid-template-columns:minmax(0,1fr)}}
.dhero .info{border:1.5px solid var(--rule-2);background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.dhero h1{font-size:clamp(56px,9vw,104px);font-weight:900}
.dhero .map{border:1.5px solid var(--rule-2);background:var(--panel);padding:16px;position:relative;min-width:0}
.dhero .map svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-data);font-size:11px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;margin-right:6px;vertical-align:middle}
.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet);border-bottom:1.5px solid var(--rule-2);margin-top:20px;padding:8px 0;display:flex;gap:4px;overflow-x:auto}
.jump a{flex:none;font-family:var(--f-data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;padding:6px 10px;border:1px solid var(--rule-2);background:var(--panel)}
.jump a:hover{color:var(--ink);border-color:var(--ink-3)}
.dsec{margin-top:30px;scroll-margin-top:60px}
.dsec>.sec{margin-top:0}
.tw{overflow-x:auto;border:1.5px solid var(--rule-2);background:var(--panel)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
table.t th{font-family:var(--f-data);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1.5px solid var(--rule-2);white-space:nowrap;background:var(--panel-2)}
table.t td{padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums}
table.t td.m{font-family:var(--f-data);font-variant-numeric:tabular-nums}
table.t tr.cut td{border-bottom:1.5px dashed var(--signal)}
table.t td .sw{display:inline-block;width:4px;height:14px;vertical-align:-2px;margin-right:8px}
table.t td.best{color:var(--purple);font-weight:600}
table.t tr.fl td{color:var(--ink-2);font-size:12.5px}
.up{color:#4ad07e}.dn{color:#ff6b6b}
.gapbar{display:inline-block;height:6px;background:var(--rule-2);vertical-align:middle;width:120px;position:relative}
.gapbar i{position:absolute;left:0;top:0;bottom:0;background:var(--done)}
.subtabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.subtabs button{background:var(--panel);border:1px solid var(--rule-2);padding:6px 12px;cursor:pointer;font-family:var(--f-data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.subtabs button[aria-pressed="true"]{border-color:var(--signal);color:var(--signal)}
.week{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.week{grid-template-columns:minmax(0,1fr)}}
.day{border:1.5px solid var(--rule-2);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:8px}
.day h3{font-size:26px;font-weight:900}
.day .ses{display:flex;gap:6px;flex-wrap:wrap}
.day .wx{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--rule);padding-top:8px}
.day .wx b{font-family:var(--f-data);font-size:24px;font-weight:500}
.day .wx span{color:var(--ink-2);font-size:13px}
.tyres{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}

const RN=done.map(r=>r.r);
function resultCell(r,s){const d=SEASON[r];if(!d)return null;const row=d.race.find(x=>norm(x[2])===norm(s));
  const sp=d.sprint?d.sprint.find(x=>norm(x[2])===norm(s)):null;return {row,sp};}
const stat=t=>/DNS/.test(t)?"DNS":/DSQ|DQ/.test(t)?"DSQ":/DNF/.test(t)?"Ret":null;
function cellInfo(row){if(!row)return{txt:"",cls:"c-none"};const st=stat(row[4]);const pos=row[0];
  if(st==="DNS")return{txt:"DNS",cls:"c-dns"};if(st==="DSQ")return{txt:"DSQ",cls:"c-dns"};
  if(pos==="NC"||pos==="DQ"){return{txt:st==="Ret"?"Ret":"NC",cls:"c-ret"};}
  const p=+pos;if(p===1)return{txt:"1",cls:"c-p1"};if(p===2)return{txt:"2",cls:"c-p2"};if(p===3)return{txt:"3",cls:"c-p3"};
  if(row[5]>0)return{txt:String(p),cls:"c-pts"};return{txt:String(p),cls:st?"c-ret":"c-fin"};}
const ptsAt=(r,s)=>{const d=SEASON[r];let t=0;(d.race||[]).concat(d.sprint||[]).forEach(x=>{if(norm(x[2])===norm(s))t+=x[5];});return t;};
const poleOf=r=>SEASON[r].quali[0][2];
const flOf=r=>RACES.find(x=>x.r===r).res.fl[0];
function cumulative(names){return names.map(n=>{let c=0;return [0,...RN.map(r=>c+=ptsAt(r,sur(n)))];});}
function teamPtsAt(r,t){const d=SEASON[r];let s=0;(d.race||[]).concat(d.sprint||[]).forEach(x=>{if(teamAt(x[2],r)===t)s+=x[5];});return s;}
function standingsAfter(r){const tot={};RN.filter(x=>x<=r).forEach(x=>{const d=SEASON[x];(d.race||[]).concat(d.sprint||[]).forEach(y=>{const n=fullName(y[2]);tot[n]=(tot[n]||0)+y[5];});});
  return Object.entries(tot).sort((a,b)=>b[1]-a[1]);}
function teamStandingsAfter(r){const tot={};Object.keys(TEAMS).forEach(t=>tot[t]=0);RN.filter(x=>x<=r).forEach(x=>Object.keys(TEAMS).forEach(t=>tot[t]+=teamPtsAt(x,t)));
  return Object.entries(tot).sort((a,b)=>b[1]-a[1]);}

    return drivers.map((dn,k)=>`<tr>${k===0?`<td class="ps" rowspan="${drivers.length}">${i+1}</td><td class="nm" rowspan="${drivers.length}"><span class="sw" style="background:${tcol(c[0])}"></span>${esc(c[0])}</td>`:""}
      <td class="nm" style="position:static;min-width:110px;color:var(--ink-2)">${esc(sur(dn))}</td>
      ${RACES.map(r=>{if(!r.res)return `<td class="cell c-none"></td>`;const {row,sp}=resultCell(r.r,sur(dn));if(!row||teamAt(row[2],r.r)!==c[0])return `<td class="cell c-none"></td>`;const ci=cellInfo(row);const spx=sp&&/^\d+$/.test(sp[0])&&+sp[0]<=8?`<sup>${sp[0]}</sup>`:"";return `<td class="cell ${ci.cls}">${ci.txt}${spx}</td>`;}).join("")}
      ${k===0?`<td class="tot" rowspan="${drivers.length}">${c[1]}</td>`:""}</tr>`).join("");}).join("");
  // stats
  const st=DRIVERS.map(d=>{const s=sur(d[0]);let w=0,pod=0,pol=0,fl=0,dnf=0,sw=0,best=99;RN.forEach(r=>{const {row,sp}=resultCell(r,s);
    if(row){const p=+row[0];if(p===1)w++;if(p>=1&&p<=3)pod++;if(p)best=Math.min(best,p);if(stat(row[4])==="Ret")dnf++;}
    if(sp&&sp[0]==="1")sw++;if(norm(poleOf(r))===norm(s))pol++;if(norm(sur(flOf(r)))===norm(s))fl++;});
    return [d,w,pod,pol,fl,sw,dnf,best===99?"–":best];});
  const teamBars=CONSTRUCTORS.map(c=>{const ds=DRIVERS.filter(d=>d[2]===c[0]);return {t:c[0],tot:c[1],ds};});
  const maxT=CONSTRUCTORS[0][1];
  return `
  <div class="sec" style="margin-top:24px"><h2>Points progression</h2><span class="lbl">Cumulative points after each round</span></div>
  ${fsbox("fs-prog","Points progression · drivers",`<div class="chips" id="chips"></div><div class="chart" id="chart"></div>`)}

  <div class="sec"><h2>Drivers' championship</h2><span class="lbl">Finishing position by round</span></div>
  ${fsbox("fs-dmx","Drivers' championship",`<div class="mx"><table class="mxt"><thead><tr><th class="ps">Pos</th><th class="nm" style="text-align:left;padding-left:10px">Driver</th>${flags}<th>Pts</th></tr></thead><tbody>${drvRows}</tbody></table></div>`)}
  <div class="keyrow"><span><i class="c-p1"></i>Winner</span><span><i class="c-p2"></i>2nd</span><span><i class="c-p3"></i>3rd</span><span><i class="c-pts"></i>Points</span><span><i class="c-fin"></i>Finished, no points</span><span><i class="c-ret"></i>Retired / not classified</span><span><i class="c-dns" style="border:1px solid var(--rule-2)"></i>Did not start / disqualified</span><span><b style="text-decoration:underline">Underline</b> pole</span><span><i style="box-shadow:inset 0 -3px 0 var(--purple);background:var(--panel-2)"></i>Fastest lap</span><span>Superscript: sprint position (points)</span></div>

  <div class="sec"><h2>Constructors' championship</h2><span class="lbl">Each driver's result for the team</span></div>
  ${fsbox("fs-cmx","Constructors' championship",`<div class="mx"><table class="mxt"><thead><tr><th class="ps">Pos</th><th class="nm" style="text-align:left;padding-left:10px">Constructor</th><th>Driver</th>${flags}<th>Pts</th></tr></thead><tbody>${teamRows}</tbody></table></div>`)}

  <div class="two" style="margin-top:28px">
    <div><div class="sec" style="margin-top:0"><h2>Team points split</h2><span class="lbl">Per driver</span></div>
      <div class="box" style="padding:14px"><div class="bars">${teamBars.map(b=>`<div class="bar"><span>${esc(b.t)}</span><span class="tr">${b.ds.map(d=>`<i style="width:${d[3]/maxT*100}%;background:${tcol(b.t)}" title="${esc(d[0])}: ${d[3]}"></i>`).join("")}</span><b>${b.tot}</b></div>`).join("")}</div>
      <p class="note2">Darker segment is the higher-placed driver. Constructor totals include points scored by stand-in drivers.</p></div></div>
    <div><div class="sec" style="margin-top:0"><h2>Team progression</h2><span class="lbl">Cumulative</span></div>${fsbox("fs-team","Team progression",`<div class="chart" id="tchart"></div>`)}</div>
  </div>

  <div class="sec"><h2>Season statistics</h2><span class="lbl">Grand Prix and sprint</span></div>
  <div class="tw"><table class="t"><thead><tr><th class="n stk0">Pos</th><th class="stk1 nonum">Driver</th><th>Team</th><th class="n">Pts</th><th class="n">Wins</th><th class="n">Podiums</th><th class="n">Poles</th><th class="n">Fastest laps</th><th class="n">Sprint wins</th><th class="n">Retirements</th><th class="n">Best finish</th></tr></thead><tbody>
  ${st.map((z,i)=>`<tr><td class="n stk0">${i+1}</td><td class="stk1 nonum"><span class="sw" style="background:${tcol(z[0][2])}"></span>${nmSpan(z[0][0])}</td><td style="color:var(--ink-2)">${esc(z[0][2])}</td><td class="n">${z[0][3]}</td>${z.slice(1).map(v=>`<td class="n">${v||"–"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
/* shared: interpolate a series [[x,y]...] at fractional x */
function interpAt(pts,p){if(p<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++){if(p<=pts[i][0]){const a=pts[i-1],b=pts[i],f=(p-a[0])/((b[0]-a[0])||1);return a[1]+(b[1]-a[1])*f;}}return pts[pts.length-1][1];}
let ANIM_SPEED=1;
function animBar(id,label){return `<div class="animbar"><button class="navbtn" id="${id}-play" aria-label="Animate ${esc(label)}">▶ Animate</button>
  <span class="spd" role="group" aria-label="Animation speed">${[[0.5,"½× slower"],[1,"1×"],[2,"2× faster"]].map(([v,t])=>`<button data-spd="${v}" aria-pressed="${ANIM_SPEED===v}">${t}</button>`).join("")}</span>
  <span class="animcap" id="${id}-cap" aria-live="off"></span></div>`;}
/* attaches progress + animation to a chart whose groups are already drawn */
function attachProgress(el,{n,X,Y,series,caption,spread=0,dur=0,clipId,headLabelsAtEnd=true}){
  const clip=el.querySelector(`#${clipId} rect`), cap=el.querySelector(`#${el.id}-cap`), btn=el.querySelector(`#${el.id}-play`);
  function set(p){
    clip.setAttribute("width",Math.max(0,X(p)+1));
    const heads=series.map(s=>{const last=s.pts[s.pts.length-1][0], first=s.pts[0][0];const pp=Math.min(p,last);const y=Y(interpAt(s.pts,pp));
      return {s,y,ly:y,vis:p>=first,fin:p>=last,x:X(pp)};});
    if(spread){const v=heads.filter(h=>h.vis).sort((a,b)=>a.y-b.y);for(let i=1;i<v.length;i++)if(v[i].ly-v[i-1].ly<spread)v[i].ly=v[i-1].ly+spread;}
    heads.forEach(h=>{const g=h.s.g;const c=g.querySelector(".hd"),t=g.querySelector(".hl"),x=g.querySelector(".rx");
      c.setAttribute("cx",h.x);c.setAttribute("cy",h.y);c.style.display=h.vis?"":"none";
      const showL=h.vis&&(!h.fin||!h.s.ret||!headLabelsAtEnd)&&!(h.fin&&h.s.ret);
      t.setAttribute("x",h.x+7);t.setAttribute("y",h.ly+3.5);t.style.display=showL?"":"none";
      if(x){x.style.display=h.fin&&h.s.ret?"":"none";if(h.fin&&h.s.ret)c.style.display="none";}});
    if(cap)cap.textContent=caption(p);
  }
  set(n);
  if(btn)btn.onclick=()=>{cancelAnimationFrame(el._raf);if(el._playing){el._playing=false;btn.textContent="▶ Animate";set(n);return;}
    el._playing=true;btn.textContent="■ Stop";if(el._hideInsp)el._hideInsp();const D=(dur||Math.max(4000,n*420))*2;let last=null,p=0;
    const step=ts=>{if(!el.isConnected)return;if(last===null)last=ts;p=Math.min(n,p+(ts-last)/D*n*ANIM_SPEED);last=ts;set(p);
      if(p<n&&el._playing)el._raf=requestAnimationFrame(step);else{el._playing=false;btn.textContent="↺ Replay";}};
    set(0);el._raf=requestAnimationFrame(step);};
}
function lineChart(el,series,{h=320,label="pts"}={}){
  cancelAnimationFrame(el._raf);el._playing=false;
  if(!series.length){el.innerHTML='<p class="note2" style="margin:0">Pick drivers above to compare.</p>';return;}
  const W=760,H=h,ml=40,mr=84,mt=12,mb=30;const n=RN.length;
  const max=Math.ceil(Math.max(...series.flatMap(s=>s.vals))/50)*50||50;
  const X=i=>ml+(W-ml-mr)*i/n, Y=v=>mt+(H-mt-mb)*(1-v/max);
  let g="";for(let v=0;v<=max;v+=max>300?100:50)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="1"/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${v}</text>`;
  RN.forEach((r,i)=>{g+=`<text x="${X(i+1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${r}</text>`;});
  const cid=`${el.id}-clip`;
  const lines=series.map((s,k)=>`<g class="sr" data-k="${k}"><polyline clip-path="url(#${cid})" points="${s.vals.map((v,i)=>X(i)+","+Y(v)).join(" ")}" fill="none" stroke="${s.col}" stroke-width="2" ${s.dash?'stroke-dasharray="5 3"':""} stroke-linejoin="round"/>
    <circle class="hd" r="3.5" fill="${s.col}"/><text class="hl" font-size="10.5" font-weight="600" fill="${s.col}" font-family="IBM Plex Mono,monospace">${esc(s.lab||s.name)}</text></g>`).join("");
  el.innerHTML=animBar(el.id,"points progression")+`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative points by round"><defs><clipPath id="${cid}"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath></defs>${g}${lines}<line id="${el.id}-g" x1="0" x2="0" y1="${mt}" y2="${H-mb}" stroke="var(--ink-3)" stroke-dasharray="2 3" opacity="0"/><rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt-mb}" fill="transparent" id="${el.id}-hit"/></svg><div class="tip" hidden></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector(".tip"),gl=el.querySelector(`#${el.id}-g`);
  const groups=[...el.querySelectorAll(".sr")];
  attachProgress(el,{n,X,Y,clipId:cid,spread:11,series:series.map((s,k)=>({g:groups[k],ret:false,pts:s.vals.map((v,i)=>[i,v])})),
    caption:p=>{const i=Math.min(n,Math.max(0,Math.ceil(p-1e-6)));return i===0?"Before round 1":`After R${RN[i-1]} · ${RACES[RN[i-1]-1].short.replace(" (Sepang)","")}`;}});
  const move=e=>{if(el._playing)return;const b=svg.getBoundingClientRect();const x=(e.clientX-b.left)/b.width*W;let i=Math.round((x-ml)/(W-ml-mr)*n);i=Math.max(1,Math.min(n,i));
    gl.setAttribute("x1",X(i));gl.setAttribute("x2",X(i));gl.setAttribute("opacity","1");
    const rows=series.map(s=>[s.name,s.vals[i],s.col]).sort((a,b)=>b[1]-a[1]);
    tip.innerHTML=`<b>R${RN[i-1]} ${esc(RACES[RN[i-1]-1].short.replace(" (Sepang)",""))}</b>${rows.map(z=>`<div><span style="color:${z[2]}">${esc(z[0])}</span><span>${z[1]}</span></div>`).join("")}`;
    tip.hidden=false;const px=X(i)/W*b.width;tip.style.left=Math.min(px+14,b.width-170)+"px";tip.style.top="44px";};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerleave",()=>{tip.hidden=true;gl.setAttribute("opacity","0");});
}
function drawCharts(){
  const el=$("#chart"); if(!el) return;
  if(!chartSel) chartSel=new Set(DRIVERS.map(d=>d[0]));
  const seen={};const series=DRIVERS.filter(d=>chartSel.has(d[0])).map(d=>{const dash=seen[d[2]];seen[d[2]]=1;return {name:sur(d[0]),lab:code(d[0]),col:tcol(d[2]),dash,vals:cumulative([d[0]])[0]};});
  $("#chips").innerHTML=`<button data-chipset="all" aria-pressed="false">All drivers</button><button data-chipset="top" aria-pressed="false">Top 6</button><button data-chipset="none" aria-pressed="false">Clear</button>`+DRIVERS.map(d=>`<button data-chip="${esc(d[0])}" aria-pressed="${chartSel.has(d[0])}"><i style="background:${tcol(d[2])}"></i>${code(d[0])}</button>`).join("");
  lineChart(el,series,{h:420});
  const tser=CONSTRUCTORS.slice(0,6).map(c=>{let s=0;return {name:c[0],lab:({"Red Bull Racing":"Red Bull","Racing Bulls":"RB","Haas F1 Team":"Haas","Aston Martin":"Aston"})[c[0]]||c[0],col:tcol(c[0]),vals:[0,...RN.map(r=>s+=teamPtsAt(r,c[0]))]};});
  lineChart($("#tchart"),tser,{h:300});
}

/* ---------- ARCHIVE ---------- */
function viewArchive(yr){
  const ys=Object.keys(ARCHIVE).map(Number).sort((a,b)=>b-a); yr=yr||2025; const a=ARCHIVE[yr];
  const rail=`<div class="yrail" role="group" aria-label="Season">${ys.map(y=>`<button data-year="${y}" aria-pressed="${y===yr}">${y}</button>`).join("")}</div>`;
  if(a.live) return rail+`<div class="arch"><div class="txt"><h1>${yr}</h1><p>In progress: ${done.length} of ${RACES.length} rounds run. ${esc(DRIVERS[0][0])} leads for Mercedes in the first year of the new power unit and active-aero rules.</p><button class="tag sig" data-go="championship" style="cursor:pointer">Open the 2026 championship →</button></div></div>`;
  const row=(p,i)=>`<div class="row"><span class="pp">${i+1}</span><span class="c" style="background:${tcol(p[1])}"></span><span><strong>${esc(p[0])}</strong><small style="display:block;color:var(--ink-3);font-size:12px">${esc(p[1])}</small></span><span class="mono">${p[2]}</span></div>`;
  return rail+`<div class="arch">
    <div class="txt"><span class="lbl">Season report</span><h1>${yr}</h1><p>${esc(a.sum)}</p><ul>${a.keys.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>
    <div class="side">
      <div class="box"><div class="bh lbl">Drivers' championship · top 3</div>${[a.champ,a.p2,a.p3].map(row).join("")}</div>
      <div class="box"><div class="bh lbl">Constructors' champion</div><div class="row"><span class="pp">1</span><span class="c" style="background:${tcol(a.cons[0])}"></span><strong>${esc(a.cons[0])}</strong><span class="mono">${a.cons[1]}</span></div></div>
      <div class="box"><div class="bh lbl">Season data</div><div class="row" style="grid-template-columns:1fr auto"><span>Races</span><span class="mono">${a.races}</span></div><div class="row" style="grid-template-columns:1fr auto"><span>Champion's wins</span><span class="mono">${esc(a.wins.split(" ")[0])}</span></div></div>
    </div></div>`;
}

/* ---------- ROUTER ---------- */
let t=null;
function setNav(k){["season","championship","archive"].forEach(x=>{const b=$("#n-"+x);if(x===k)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});}
function route(){document.body.classList.remove("fs-lock");
  clearInterval(t); closeDrawer();
  const h=(location.hash||"#season").slice(1);
  if(h.startsWith("archive")){const y=+h.split("-")[1];$("#app").innerHTML=viewArchive(ARCHIVE[y]?y:null);$("#sheetname").textContent="SEASON ARCHIVE";setNav("archive");}
  else if(h==="championship"){$("#app").innerHTML=viewChampionship();drawCharts();$("#sheetname").textContent="2026 CHAMPIONSHIP · POINTS";setNav("championship");}
  else if(h.startsWith("detail-")){const n=+h.slice(7);lapSel=new Set();$("#app").innerHTML=viewDetail(n);drawLapChart();const r=RACES.find(x=>x.r===n);$("#sheetname").textContent=r?`R${n} · ${r.gp.toUpperCase()}`:"";setNav("season");}
  else{$("#app").innerHTML=viewSeason();tower("d");countdown();$("#sheetname").textContent="2026 WORLD CHAMPIONSHIP";setNav("season");
    if(h.startsWith("race-"))openRace(+h.slice(5));}
  window.scrollTo(0,0);
}
function countdown(){const el=$("#cd");if(!el)return;const T=Date.parse(nextRace.start);
  const tick=()=>{let s=Math.max(0,Math.floor((T-Date.now())/1000));if(!s){el.innerHTML="<b style='font-size:20px'>Race weekend live</b>";return;}
    const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
    el.innerHTML=v.map((n,i)=>`<b>${String(n).padStart(2,"0")}</b><i>${["d","h","m","s"][i]}</i>`).join("");};
  tick();t=setInterval(tick,1000);}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")){history.replaceState(null,"","#season");closeDrawer();return;}
  const b=e.target.closest("[data-quick],[data-detail],[data-go],[data-year],[data-fp],[data-chip],[data-jump],[data-order],[data-lap],[data-fs],[data-spd],[data-chipset],#t-d,#t-c");if(!b)return;
  if(b.dataset.fs){toggleFS(b.dataset.fs);return;}
  if(b.dataset.spd){ANIM_SPEED=+b.dataset.spd;document.querySelectorAll("[data-spd]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.spd===ANIM_SPEED));return;}
  if(b.dataset.order){plateOrder=b.dataset.order;try{localStorage.setItem("pa-order",plateOrder)}catch(err){}const y=window.scrollY;route();window.scrollTo(0,y);return;}
  if(b.dataset.lap){const v=b.dataset.lap;if(v==="clear")lapSel.clear();else{const d=+v;lapSel.has(d)?lapSel.delete(d):lapSel.add(d);}applyLapSel();return;}
  if(b.dataset.chipset){const v=b.dataset.chipset;chartSel=new Set(v==="all"?DRIVERS.map(d=>d[0]):v==="top"?DRIVERS.slice(0,6).map(d=>d[0]):[]);drawCharts();return;}
  if(b.id==="t-d")return tower("d"); if(b.id==="t-c")return tower("c");
  if(b.dataset.jump){e.preventDefault();const s=$("#s-"+b.dataset.jump);if(s)s.scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(b.dataset.fp){const n=+location.hash.slice(8);document.querySelectorAll("[data-fp]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#fp-out").innerHTML=practiceTable(SEASON[n][b.dataset.fp],n);return;}
  if(b.dataset.chip){const k=b.dataset.chip;chartSel.has(k)?chartSel.delete(k):chartSel.add(k);drawCharts();return;}
  if(b.dataset.year){location.hash="archive-"+b.dataset.year;return;}
  if(b.dataset.go){location.hash=b.dataset.go;return;}
  if(b.dataset.detail){location.hash="detail-"+b.dataset.detail;return;}
  if(b.dataset.quick){const n=+b.dataset.quick;history.replaceState(null,"","#race-"+n);if(!$(".home")){route();}else openRace(n);}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$(".fsbox.full")){toggleFS($(".fsbox.full").id,false);return;}if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("article[role=button]")){e.preventDefault();e.target.click();return;}if(e.key==="Escape"&&$(".drawer")){history.replaceState(null,"","#season");closeDrawer();}});
window.addEventListener("hashchange",route);
route();
</script>
